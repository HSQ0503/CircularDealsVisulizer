<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AI Deal Network favicon">
  <title>AI Deal Network</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#06080d"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow-money" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7ed957"/>
    </marker>
    <marker id="arrow-compute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ff4f8a"/>
    </marker>
    <marker id="arrow-service" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f8eff"/>
    </marker>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#ecebe6" stroke-opacity="0.08"/>
  <circle cx="32" cy="32" r="8" fill="none" stroke="#d4a85a" stroke-width="1.4" stroke-opacity="0.78"/>
  <circle cx="32" cy="32" r="2.4" fill="#d4a85a"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M 37 13 C 52 16 58 31 49 43" stroke="#7ed957" stroke-width="3" marker-end="url(#arrow-money)"/>
    <path d="M 45 48 C 34 58 18 55 15 43" stroke="#4f8eff" stroke-width="3" marker-end="url(#arrow-service)"/>
    <path d="M 14 37 C 8 24 17 12 29 13" stroke="#ff4f8a" stroke-width="3" marker-end="url(#arrow-compute)"/>
  </g>

  <g stroke="#ecebe6" stroke-width="1.6">
    <circle cx="32" cy="13" r="6.4" fill="#0c1118"/>
    <circle cx="15" cy="45" r="6.4" fill="#0c1118"/>
    <circle cx="49" cy="45" r="6.4" fill="#0c1118"/>
  </g>
  <circle cx="32" cy="13" r="2.7" fill="#7ed957"/>
  <circle cx="15" cy="45" r="2.7" fill="#ff4f8a"/>
  <circle cx="49" cy="45" r="2.7" fill="#4f8eff"/>
</svg>
